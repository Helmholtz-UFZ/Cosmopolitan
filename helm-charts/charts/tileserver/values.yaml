enabled: true

replicaCount: 1

strategy:
  type: Recreate

terminationGracePeriodSeconds: 60

image:
  repository: ghcr.io/developmentseed/titiler
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []

environmentVariables:
  - name: "CPL_TMPDIR"
    value: "/tmp"
  - name: "GDAL_CACHEMAX"
    value: "75%"
  - name: "GDAL_INGESTED_BYTES_AT_OPEN"
    value: "32768"
  - name: "GDAL_DISABLE_READDIR_ON_OPEN"
    value: "EMPTY_DIR"
  - name: "GDAL_HTTP_MERGE_CONSECUTIVE_RANGES"
    value: "YES"
  - name: "GDAL_HTTP_MULTIPLEX"
    value: "YES"
  - name: "GDAL_HTTP_VERSION"
    value: "2"
  - name: "VSI_CACHE"
    value: "true"
  - name: "VSI_CACHE_SIZE"
    value: "5000000"

nameOverride: ""
fullnameOverride: "cosmopolitan-tileserver"


podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe: {}
#  httpGet:
#    path: /
#    port: http
readinessProbe: {}
#  httpGet:
#    path: /
#    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

persistence:
  enabled: false
  storageClassName: "tanzu-storage-policy-raid5-ftt1"
  name: "cosmopolitan-tileserver-data-dir-pvc"
  size: "10G"

volumes: []
# - name: cosmopolitan-tileserver-data-dir
#   persistentVolumeClaim:
#     claimName: custom-rdm-geonetwork-pvc

volumeMounts: []
# - name: cosmopolitan-tileserver-data-dir
#   mountPath: "/data"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
