enabled: true

replicaCount: 1

strategy:
  type: Recreate

terminationGracePeriodSeconds: 60

image:
  repository: registry.hzdr.de/ufz/tb5-smm/met/wg7/cosmopolitan
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
#  - name: wombat-docker-registry-codebase

environmentVariables:
  - name: "EMAIL_PORT"
    value: "587"
  - name: "EMAIL_SENDER"
    value: "cosmopolitan@example.de"
  - name: "EMAIL_SERVER"
    value: "smtp.example.de"
  - name: "EMAIL_USERNAME"
    value: "user_name"
  - name: "EMAIL_PASSWORD"
    value: ""
  - name: "FLASK_DEBUG"
    value: "0"
  - name: "FLASK_PORT"
    value: "8080"
  - name: "MAINTAINER_EMAIL"
    value: ""
  - name: "OBJECT_STORAGE_BUCKET"
    value: "cosmopolitan-prod"
  - name: "OBJECT_STORAGE_HOST"
    value: "https://s3"
  - name: "OBJECT_STORAGE_REMOTE_NAME"
    value: "cosmopolitan-remote"
  - name: "OBJECT_STORAGE_ACCESS_KEY"
    value: ""
  - name: "OBJECT_STORAGE_SECRET_KEY"
    value: ""
  - name: "POSTGRES_DB"
    value: "somweb_prod"
  - name: "POSTGRES_HOST_NAME"
    value: "postgres.intranet.ufz.de"
  - name: "POSTGRES_PORT"
    value: "5432"
  - name: "POSTGRES_USER"
    value: "somweb_prod_rw"
  - name: "POSTGRES_PASSWORD"
    value: ""
  - name: "CLUSTER_TOKEN"
    value: ""
  - name: "WEB_OUTSIDE_URL"
    value: "https://cosmopolitan.example.de"
  - name: "WEB_WORK_DIR"
    value: "./cosmopolitan_app/work_dir"

nameOverride: ""
fullnameOverride: "cosmopolitan-frontend"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe: {}
#  httpGet:
#    path: /
#    port: 8080
#  initialDelaySeconds: 10
#  periodSeconds: 30
readinessProbe: {}
#  httpGet:
#    path: /check_health
#    path: /
#    port: 8080
#  initialDelaySeconds: 60
#  periodSeconds: 120
#  timeoutSeconds: 40

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes: []
#  - name: cosmopolitan-work-dir
#    persistentVolumeClaim:
#      claimName: cosmopolitan-work-dir-pvc

volumeMounts: []
#  - mountPath: "/python_docker/cosmopolitan/work_dir"
#    name: cosmopolitan-work-dir

nodeSelector: {}

tolerations: []

affinity: {}
