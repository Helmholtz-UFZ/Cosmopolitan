enabled: true

replicaCount: 1

image:
  repository: redis
  pullPolicy: IfNotPresent
  tag: "7-alpine"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: "cosmopolitan-redis"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 6379

resources: {}
#  limits:
#    cpu: 500m
#    memory: 256Mi
#  requests:
#    cpu: 100m
#    memory: 128Mi

persistence:
  enabled: false
  storageClassName: ""
  size: "1Gi"

nodeSelector: {}

tolerations: []

affinity: {}
