persistence:
  enabled: true
  storageClassName: "tanzu-storage-policy-raid5-ftt1"
  name: "cosmopolitan-work-dir-pvc"
  size: "10G"
frontend:
  enabled: true
  image:
    repository: registry.hzdr.de/ufz/tb5-smm/met/wg7/cosmopolitan/frontend
    tag: "0.1.5-2026.03.27"
  imagePullSecrets:
    - name: wombat-docker-registry-codebase
  podAnnotations:
    rdm.ufz.de/inception-date: "20240110"
    rdm.ufz.de/duration-in-years: "2"
  environmentVariables:
    - name: "TZ"
      value: "Europe/Berlin"
    - name: "EMAIL_PORT"
      value: "587"
    - name: "EMAIL_SENDER"
      value: "cosmopolitan@ufz.de"
    - name: "EMAIL_SERVER"
      value: "smtp.ufz.de"
    - name: "EMAIL_USERNAME"
      value: "soncosmo"
    - name: "EMAIL_PASSWORD"
      valueFrom:
        secretKeyRef:
          name: "custom-met-cosmopolitan.secrets"
          key: "EMAIL_PASSWORD"
    - name: "FLASK_DEBUG"
      value: "0"
    - name: "FLASK_PORT"
      value: "8080"
    - name: "MAINTAINER_EMAIL"
      value: "john-eric.anders@ufz.de"
    - name: "OBJECT_STORAGE_BUCKET"
      value: "cosmopolitan-prod"
    - name: "OBJECT_STORAGE_HOST"
      value: "https://vip.s3.ufz.de"
    - name: "OBJECT_STORAGE_REMOTE_NAME"
      value: "cosmopolitan-remote"
    - name: "OBJECT_STORAGE_ACCESS_KEY"
      value: "AKIAAFYN1KMQ2RI1TH7CG"
    - name: "OBJECT_STORAGE_SECRET_KEY"
      valueFrom:
        secretKeyRef:
          name: "custom-met-cosmopolitan.secrets"
          key: "OBJECT_STORAGE_SECRET_KEY"
    - name: "POSTGRES_DB"
      value: "somweb_prod"
    - name: "POSTGRES_HOST_NAME"
      value: "postgres.intranet.ufz.de"
    - name: "POSTGRES_PORT"
      value: "5432"
    - name: "POSTGRES_USER"
      value: "somweb_prod_rw"
    - name: "POSTGRES_PASSWORD"
      valueFrom:
        secretKeyRef:
          name: "custom-met-cosmopolitan.secrets"
          key: "DB_PW"
    - name: "CLUSTER_TOKEN"
      valueFrom:
        secretKeyRef:
          name: "custom-met-cosmopolitan.secrets"
          key: "CLUSTER_TOKEN"
    - name: "WEB_OUTSIDE_URL"
      value: "https://cosmopolitan.web-intern-stage.app.ufz.de"
    - name: "WEB_WORK_DIR"
      value: "/python_docker/cosmopolitan/cosmopolitan_app/work_dir"
    - name: "TILESERVER_URL"
      value: "https://cosmopolitan-ts.web-intern-stage.app.ufz.de"
    - name: "REDIS_HOST"
      value: "cosmopolitan-redis"
    - name: "REDIS_PORT"
      value: "6379"
    - name: "REDIS_DB"
      value: "0"
    - name: "REDIS_PASSWORD"
      value: ""
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "cert-manager-acme"
      cert-manager.io/private-key-algorithm: "ECDSA"
      cert-manager.io/private-key-size: "384"
      cert-manager.io/private-key-rotation-policy: "Always"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'Content-Security-Policy' "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://*.app.ufz.de; style-src 'self' 'unsafe-inline'; font-src 'self' ; frame-src 'self' *.ufz.de ; child-src 'self' *.ufz.de ; object-src 'none' ; frame-ancestors 'self' http://*.ufz.de https://*.ufz.de ;" always;
        add_header 'X-XSS-Protection' '1';
    hosts:
      - host: "cosmopolitan.web-intern-stage.app.ufz.de"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: cosmopolitan-web-intern-stage-app-ufz-de
        hosts:
          - "cosmopolitan.web-intern-stage.app.ufz.de"
  resources:
    limits:
      cpu: 1000m
      memory: 1500Mi
    requests:
      cpu: 500m
      memory: 512Mi
  volumes:
    - name: cosmopolitan-work-dir
      persistentVolumeClaim:
        claimName: cosmopolitan-work-dir-pvc
  volumeMounts:
    - mountPath: "/python_docker/cosmopolitan/cosmopolitan_app/work_dir"
      name: cosmopolitan-work-dir
