    - name: "TILESERVER_URL"
      value: "https://cosmopolitan-ts.web-intern-stage.app.ufz.de"
    - name: "REDIS_HOST"
      value: "cosmopolitan-redis"
    - name: "REDIS_PORT"
      value: "6379"
    - name: "REDIS_DB"
      value: "0"
    - name: "REDIS_PASSWORD"
      value: ""
  resources:
    limits:
      cpu: 1500m
      memory: 7000Mi
    requests:
      cpu: 500m
      memory: 2000Mi
  volumes:
    - name: cosmopolitan-work-dir
      persistentVolumeClaim:
        claimName: cosmopolitan-work-dir-pvc
  volumeMounts:
    - mountPath: "/python_docker/cosmopolitan/cosmopolitan_app/work_dir"
      name: cosmopolitan-work-dir
tileserver:
  enabled: true
  securityContext:
    allowPrivilegeEscalation: false
    #    capabilities:
    #      drop: [ "ALL" ]
    #    runAsNonRoot: true  # Container läuft leider nicht als Non-Root
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      cpu: 500m
      memory: 1000Mi
    requests:
      cpu: 500m
      memory: 500Mi
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "cert-manager-acme"
      cert-manager.io/private-key-algorithm: "ECDSA"
      cert-manager.io/private-key-size: "384"
      cert-manager.io/private-key-rotation-policy: "Always"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'Content-Security-Policy' "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self' ; frame-src 'self' *.ufz.de ; child-src 'self' *.ufz.de ; object-src 'none' ; frame-ancestors 'self' http://*.ufz.de https://*.ufz.de ;" always;
        add_header 'X-XSS-Protection' '1';
    hosts:
      - host: "cosmopolitan-ts.web-intern-stage.app.ufz.de"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: cosmopolitan--ts-web-intern-stage-app-ufz-de
        hosts:
          - "cosmopolitan-ts.web-intern-stage.app.ufz.de"
  tolerations:
    - key: "role"
      operator: "Equal"
      value: "ai"
      effect: "NoSchedule"
  volumes:
    - name: cosmopolitan-work-dir
      persistentVolumeClaim:
        claimName: cosmopolitan-work-dir-pvc
  volumeMounts:
    - mountPath: "/data"
      name: cosmopolitan-work-dir
redis:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    name: "cosmopolitan-redis"
    storageClassName: "tanzu-storage-policy-raid5-ftt1"
    size: "1Gi"
