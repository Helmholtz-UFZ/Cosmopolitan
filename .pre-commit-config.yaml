repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v2.3.0
  hooks:
    - id: check-yaml
      files: '\.ya?ml$'
      # Syntax only: GitLab CI YAML uses custom tags such as !reference.
      args: [--unsafe]
    - id: end-of-file-fixer
      files: '\.py$'
    - id: trailing-whitespace
      files: '\.py$'
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.6
  hooks:
    - id: ruff-format
      types_or: [python, pyi]
    - id: ruff
      types_or: [python, pyi]
      args: [--fix]
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.21.2
  hooks:
    # Blocks commits that add a secret; same idea as the Secret Detection CI job.
    - id: gitleaks
