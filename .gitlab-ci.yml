---
stages:
  - "lint"
  - "test"
  - "build"
  - "deploy"

variables:
  POSTGRES_DB: somweb_stage
  POSTGRES_USER: somweb_stage_rw
  POSTGRES_PASSWORD: test
  POSTGRES_HOST_AUTH_METHOD: trust
  POSTGRES_HOST_NAME: postgres
  POSTGRES_PORT: 5432
  OBJECT_STORAGE_ACCESS_KEY: "accesskey"
  OBJECT_STORAGE_SECRET_KEY: "secretkey"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_PASSWORD: ""

.docker_login: &docker_login
  - 'echo "${CI_REGISTRY_PASSWORD}" | docker login --username "$CI_REGISTRY_USER" --password-stdin "${CI_REGISTRY}"'

.base_before_build_script:
  image: "docker:29-cli"
  services:
    - "docker:29-dind"
  tags:
    - "hifis"

linting:
  stage: "lint"
  image: "python:3.13"
  before_script:
    - "pip install uv"
    - "uv sync"
  script:
    - "uv run ruff format --check ."
    - "uv run ruff check ."

test:
  stage: "test"
  image: "python:3.13"
  services:
    - name: postgis/postgis:latest
      alias: postgres
    - name: "minio/minio:latest"
      alias: minio
      command: ["server", "/data", "--console-address", ":9001"]
      variables:
        MINIO_ROOT_USER: "${OBJECT_STORAGE_ACCESS_KEY}"
        MINIO_ROOT_PASSWORD: "${OBJECT_STORAGE_SECRET_KEY}"
    - name: "redis:7-alpine"
      alias: redis
  variables:
  before_script:
    - apt-get update && apt-get install -y postgresql-client libcairo2-dev curl rclone
    - "cp env_test .env"
    - "source .env && rclone config create minio s3 provider=Minio access_key_id=${OBJECT_STORAGE_ACCESS_KEY} secret_access_key=${OBJECT_STORAGE_SECRET_KEY} endpoint=${OBJECT_STORAGE_HOST}"
    - "source .env && rclone mkdir minio:${OBJECT_STORAGE_BUCKET}"
    - "rclone lsd minio:"

    - "export PGPASSWORD=${POSTGRES_PASSWORD}"
    - "psql -h ${POSTGRES_HOST_NAME} -U ${POSTGRES_USER} -d ${POSTGRES_DB} < docker/init.sql"
    - "pip install uv"
    - "uv sync"
    - "uv run playwright install --with-deps chromium"
    - "mkdir -p test/artifacts"
  script:
    - uv run pytest -v --screenshot only-on-failure --tracing retain-on-failure --output test/artifacts
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - test/artifacts/

# "latest" image will be built on every push to the main-branch
build-latest:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
  script:
    - "docker build -t ${CI_REGISTRY_IMAGE}/frontend:latest -f docker/prod.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/frontend"
    - "docker build -t ${CI_REGISTRY_IMAGE}/worker:latest -f docker/worker.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/worker"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: "never"


# a release-tag will be built when creating a tag with the name matching the regex (^\d+.\d+.\d+)
build-release:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
    - "apk update && apk add --no-cache jq yq"
  script:
    - "docker build -t ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_TAG} -f docker/prod.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/frontend"
    - "docker build -t ${CI_REGISTRY_IMAGE}/worker:${CI_COMMIT_TAG} -f docker/worker.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/worker"
    - yq -i ".frontend.image.tag = \"${CI_COMMIT_TAG}\"" deployments/ufz/stage/values.yaml
    - yq -i ".worker.image.tag = \"${CI_COMMIT_TAG}\"" deployments/ufz/stage/values.yaml
  artifacts:
    paths:
      - "deployments/ufz/stage/values.yaml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+.\d+.\d+/'
      when: "always"
    - when: "never"

# builds a fresh Docker-Image from the most recent Git-Tag und postfixes the current date
# e.g. <IMAGE>:<TAG> becomes <IMAGE>:<TAG>-YYYY.MM.DD
build-latest-tag:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
    - "apk update && apk add --no-cache jq yq git"
    - "git fetch --tags --force"
    - "GIT_LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)"
    - "git fetch origin ${GIT_LATEST_TAG}"
    - "git checkout ${GIT_LATEST_TAG}"
  script:
    - "calver=$(date +'%Y.%m.%d')"
    - 'docker build -t "${CI_REGISTRY_IMAGE}/frontend:${GIT_LATEST_TAG}-${calver}" -f docker/prod.Dockerfile .'
    - 'docker push --all-tags "${CI_REGISTRY_IMAGE}/frontend"'
    - 'docker build -t "${CI_REGISTRY_IMAGE}/worker:${GIT_LATEST_TAG}-${calver}" -f docker/worker.Dockerfile .'
    - 'docker push --all-tags "${CI_REGISTRY_IMAGE}/worker"'
    - yq -i ".frontend.image.tag = \"${GIT_LATEST_TAG}-${calver}\"" deployments/ufz/stage/values.yaml
    - yq -i ".worker.image.tag = \"${GIT_LATEST_TAG}-${calver}\"" deployments/ufz/stage/values.yaml
  artifacts:
    paths:
      - "deployments/ufz/stage/values.yaml"
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'web'"
    - when: "never"


# preparation for git - so that the job "bump_version_for_cluster"
.prepare: &prepare
  - "apt-get update -y && apt-get install git openssh-client -yqq"
  - "eval $(ssh-agent -s)"
  - 'echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -'
  - "mkdir -p ~/.ssh && chmod 700 ~/.ssh"
  - 'echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - "git config --global user.email '${GITLAB_USER_EMAIL}'"
  - "git config --global user.name '${GITLAB_USER_LOGIN}'"
  - "git config pull.rebase true"
  - "git remote set-url --push origin git@${CI_SERVER_HOST}:${CI_PROJECT_PATH}"

bump_version_for_cluster:
  stage: "deploy"
  variables:
    BRANCH: "main"
  script:
    - *prepare
    # Keep pyproject.toml's version in step with the tag. Without this nobody owns the
    # file: a human tags, CI hands the tag to the deployment, and the version stays put
    # — it sat at 0.1.7 while the latest tag was 0.2.3.
    # Guarded because this job also runs for schedule/web pipelines, where
    # CI_COMMIT_TAG is empty and an unguarded sed would blank the version.
    - 'if [ -n "${CI_COMMIT_TAG}" ]; then sed -i "s/^version = .*/version = \"${CI_COMMIT_TAG}\"/" pyproject.toml; fi'
    - "git add deployments/ufz/stage/values.yaml pyproject.toml"
    - "git commit -m 'automatically increased tag-version for cluster-deployment'"
    - "git pull origin ${BRANCH} --strategy-option=ours"
    - "git push origin HEAD:$BRANCH -o ci.skip"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+.\d+.\d+/'
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'web'"
    - when: "never"
