stages:
  - "build"

.base_before_build_script:
  image: "docker:24-cli"
  services:
    - "docker:24-dind"
  tags:
    - "hifis"

build-latest:
  stage: "build"
  extends: ".base_before_build_script"
  script:
    - 'echo "${CI_REGISTRY_PASSWORD}" | docker login --username "$CI_REGISTRY_USER" --password-stdin "${CI_REGISTRY}"'
    - 'docker build --build-arg GIT_PAT_SM="$GIT_PAT_SM" -t ${CI_REGISTRY_IMAGE}:latest .'
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

build-release:
  stage: "build"
  extends: ".base_before_build_script"
  script:
    - 'echo "${CI_REGISTRY_PASSWORD}" | docker login --username "$CI_REGISTRY_USER" --password-stdin "${CI_REGISTRY}"'
    - 'docker build --build-arg GIT_PAT_SM="$GIT_PAT_SM" --build-arg GUNICORN=1 --build-arg PORT=8080 -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG} .'
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+.\d+.\d+/'
      when: "always"
    - when: "never"
