stages:
  - setup
  - build

setup:
  stage: setup
  image: ubuntu:20.04
  script:
    - apt-get update -qy
    - apt-get install -y docker.io
    - docker --version

build_image:
  stage: build
  script:
    - docker build --build-arg GIT_PAT_SM="$GIT_PAT_SM" \
                   --build-arg GUNICORN=1 \
                   --build-arg PORT=8080 \
                   -t cosmopolitan-test .
