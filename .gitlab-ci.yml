---
stages:
  - "lint"
  - "test"
  - "build"
  - "deploy"
  - "helm-package"

variables:
  POSTGRES_DB: somweb_stage
  POSTGRES_USER: somweb_stage_rw
  POSTGRES_PASSWORD: test
  POSTGRES_HOST_AUTH_METHOD: trust
  POSTGRES_HOST_NAME: postgres
  POSTGRES_PORT: 5432
  EMAIL_PORT: 1025
  MAIL_HOG_PORT: 8025
  MINIO_ACCESS_KEY: "accesskey"
  MINIO_SECRET_KEY: "secretkey"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_PASSWORD: ""

.docker_login: &docker_login
  - 'echo "${CI_REGISTRY_PASSWORD}" | docker login --username "$CI_REGISTRY_USER" --password-stdin "${CI_REGISTRY}"'

.base_before_build_script:
  image: "docker:29-cli"
  services:
    - "docker:29-dind"
  tags:
    - "hifis"

linting:
  stage: "lint"
  image: "python:3.13"
  before_script:
    - "pip install poetry"
    - "poetry install"
  script:
    - "poetry run black --check ."
    - "poetry run isort --check --profile black ."
    - "poetry run flake8 --max-line-length 88 --ignore=E203,W503"

test:
  stage: "test"
  image: "python:3.13"
  services:
    - name: postgis/postgis:latest
      alias: postgres
    - name: "mailhog/mailhog:latest"
      alias: mailhog
      command:
        [
          "-smtp-bind-addr",
          "0.0.0.0:1025",
          "-api-bind-addr",
          "0.0.0.0:8025",
          "-ui-bind-addr",
          "0.0.0.0:8025",
        ]
    - name: "minio/minio:latest"
      alias: minio
      command: ["server", "/data", "--console-address", ":9001"]
      variables:
        MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
        MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    - name: "redis:7-alpine"
      alias: redis
  variables:
    MINIO_URL: "http://minio:9000"
  before_script:
    - apt-get update && apt-get install -y postgresql-client libc-dev libcairo2-dev curl unzip wget gnupg2 libglib2.0-0 libnss3 libfontconfig1 libxss1 libappindicator3-1 libasound2 xvfb

    # Install Chrome
    - wget -q https://dl.google.com/linux/linux_signing_key.pub -O- | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update && apt-get install -y google-chrome-stable

    # Install ChromeDriver
    - CHROME_VERSION=$(google-chrome-stable --version | grep -oP '\d+\.\d+\.\d+' | head -1)
    - CHROMEDRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json" | python3 -c "import sys, json; print(json.load(sys.stdin)['channels']['Stable']['version'])")

    # Download ChromeDriver zip from the new location
    - CHROMEDRIVER_BASE_URL="https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing"
    - CHROMEDRIVER_ZIP_URL="${CHROMEDRIVER_BASE_URL}/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
    - wget -O /tmp/chromedriver.zip "$CHROMEDRIVER_ZIP_URL"
    - unzip /tmp/chromedriver.zip -d /tmp/
    - mv /tmp/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
    - chmod +x /usr/local/bin/chromedriver

    # Install rclone
    - "curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip"
    - "unzip rclone-current-linux-amd64.zip"
    - "cp rclone-*-linux-amd64/rclone /usr/local/bin/"
    - "chmod +x /usr/local/bin/rclone"
    - "rm -rf rclone-*"
    - "rclone config create minio s3 provider=Minio access_key_id=${MINIO_ACCESS_KEY} secret_access_key=${MINIO_SECRET_KEY} endpoint=http://minio:9000"
    - "rclone mkdir minio:cosmopolitan-dev"
    - "rclone lsd minio:" # List available buckets

    - "export PGPASSWORD=${POSTGRES_PASSWORD}"
    - "psql -h ${POSTGRES_HOST_NAME} -U ${POSTGRES_USER} -d ${POSTGRES_DB} < docker/init.sql"
    - "cp env_test .env"
    - "curl mailhog:8025 > /dev/null"
    - "pip install poetry"
    - "poetry install"
  script:
    - poetry run pytest --webdriver=Chrome --headless --capture=no
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - test_failures/

# "latest" image will be built on every push to the main-branch
build-latest:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
  script:
    - "docker build -t ${CI_REGISTRY_IMAGE}/frontend:latest -f docker/prod.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/frontend"
    - "docker build -t ${CI_REGISTRY_IMAGE}/worker:latest -f docker/worker.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/worker"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: "never"


# a release-tag will be built when creating a tag with the name matching the regex (^\d+.\d+.\d+)
build-release:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
    - "apk update && apk add --no-cache jq yq"
  script:
    - "docker build -t ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_TAG} -f docker/prod.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/frontend"
    - "docker build -t ${CI_REGISTRY_IMAGE}/worker:${CI_COMMIT_TAG} -f docker/worker.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/worker"
    - yq -i ".frontend.image.tag = \"${CI_COMMIT_TAG}\"" deployments/ufz/stage/values.yaml
    - yq -i ".worker.image.tag = \"${CI_COMMIT_TAG}\"" deployments/ufz/stage/values.yaml
  artifacts:
    paths:
      - "deployments/ufz/stage/values.yaml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+.\d+.\d+/'
      when: "always"
    - when: "never"

# builds a fresh Docker-Image from the most recent Git-Tag und postfixes the current date
# e.g. <IMAGE>:<TAG> becomes <IMAGE>:<TAG>-YYYY.MM.DD
build-latest-tag:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
    - "apk update && apk add --no-cache jq yq git"
    - "git fetch"
    - "GIT_LATEST_TAG=$(git describe --tags --abbrev=0)"
    - "git fetch origin ${GIT_LATEST_TAG}"
    - "git checkout ${GIT_LATEST_TAG}"
  script:
    - "GIT_LATEST_TAG=$(git describe --tags --abbrev=0)"
    - "calver=$(date +'%Y.%m.%d')"
    - 'docker build -t "${CI_REGISTRY_IMAGE}/frontend:${GIT_LATEST_TAG}-${calver}" -f docker/prod.Dockerfile .'
    - 'docker push --all-tags "${CI_REGISTRY_IMAGE}/frontend"'
    - 'docker build -t "${CI_REGISTRY_IMAGE}/worker:${GIT_LATEST_TAG}-${calver}" -f docker/worker.Dockerfile .'
    - 'docker push --all-tags "${CI_REGISTRY_IMAGE}/worker"'
    - yq -i ".frontend.image.tag = \"${GIT_LATEST_TAG}-${calver}\"" deployments/ufz/stage/values.yaml
    - yq -i ".worker.image.tag = \"${GIT_LATEST_TAG}-${calver}\"" deployments/ufz/stage/values.yaml
  artifacts:
    paths:
      - "deployments/ufz/stage/values.yaml"
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'web'"
    - when: "never"


# preparation for git - so that the job "bump_version_for_cluster"
.prepare: &prepare
  - "apt-get update -y && apt-get install git openssh-client -yqq"
  - "eval $(ssh-agent -s)"
  - 'echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -'
  - "mkdir -p ~/.ssh && chmod 700 ~/.ssh"
  - 'echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - "git config --global user.email '${GITLAB_USER_EMAIL}'"
  - "git config --global user.name '${GITLAB_USER_LOGIN}'"
  - "git config pull.rebase true"
  - "git remote set-url --push origin git@${CI_SERVER_HOST}:${CI_PROJECT_PATH}"

bump_version_for_cluster:
  stage: "deploy"
  variables:
    BRANCH: "main"
  script:
    - *prepare
    - "git add deployments/ufz/stage/values.yaml"
    - "git commit -m 'automatically increased tag-version for cluster-deployment'"
    - "git pull origin ${BRANCH} --strategy-option=ours"
    - "git push origin HEAD:$BRANCH -o ci.skip"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+.\d+.\d+/'
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'web'"
    - when: "never"

helm-package:
  stage: "helm-package"
  image:
    name: "alpine/helm:3.19"
    entrypoint: [""]
  cache: []
  variables:
    OCI_REGISTRY_URL: "${CI_REGISTRY}/${CI_PROJECT_PATH}"
  script:
    - "CHART_NAME=$(helm show chart ./helm-charts | grep -E '^name:' | awk '{print $2}')"
    - "CHART_VERSION=$(helm show chart ./helm-charts | grep -E '^version:' | awk '{print $2}')"
    - "helm package ./helm-charts/"
    - "echo $CI_JOB_TOKEN | helm registry login -u $CI_REGISTRY_USER --password-stdin ${CI_REGISTRY}"
    - "helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://${OCI_REGISTRY_URL}"
  rules:
    #    - if: '$CI_COMMIT_TAG =~ /^(\d+\.\d+\.\d+(-[a-zA-Z0-9]*)?)$/'
    - when: "manual"
