[project]
name = "cosmopolitan"
version = "0.2.4"
description = "COSmic ray based soil MOisture PredictiOn LIve descicion Tree ANalysis"
authors = [
    { name = "John Anders", email = "john-eric.anders@ufz.de" },
    { name = "Louis Trinkle", email = "louis-ferdinand.trinkle@ufz.de" },
]
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.13"
dependencies = [
    "cosmo-suite @ git+https://codebase.helmholtz.cloud/ufz/tb5-smm/met/wg7/cosmo-suite@v0.4.1",
    "dash[ag-grid]>=3.0.4,<4",
    "soil-moisture-prediction>=0.1.0,<0.2",
    "dash-bootstrap-components>=2.0.3,<3",
    "celery[redis]>=5.3.0,<6",
    # python-dotenv, not the `dotenv` shim package: both ship a `dotenv` module and
    # cosmo-suite depends on python-dotenv directly.
    "python-dotenv>=1,<2",
    "psycopg2>=2.9.10,<3",
    "sqlalchemy>=2.0.41,<3",
    "geoalchemy2>=0.17.1,<0.18",
    "shapely>=2.1.1,<3",
    "pycairo>=1.28.0,<2",
    "py-staticmaps>=0.4.0,<0.5",
    "coolname>=2.2.0,<3",
    "pyproj>=3.7.1,<4",
    "email-validator>=2.2.0,<3",
    "gunicorn>=23.0.0,<24",
    "dash-leaflet>=1.1.3,<2",
    "dash-form-factory==0.1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pytest-playwright>=0.6.2",
    "python-slugify>=8.0.0",
    "selenium>=4.0.0",
    "ruff>=0.7.4",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# cosmo-suite is pinned by git URL (no PyPI release); hatchling rejects direct
# references in project.dependencies unless this is set.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cosmopolitan_app"]

