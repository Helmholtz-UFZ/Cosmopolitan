[project]
name = "cosmopolitan"
version = "0.1.3"
description = "COSmic ray based soil MOisture PredictiOn LIve descicion Tree ANalysis"
authors = [{ name = "John Anders", email = "john-eric.anders@ufz.de" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash[ag-grid]>=3.0.4,<4",
    "soil-moisture-prediction>=0.1.0,<0.2",
    "dash-bootstrap-components>=2.0.3,<3",
    "celery[redis]>=5.3.0,<6",
    "dotenv>=0.9.9,<0.10",
    "psycopg2>=2.9.10,<3",
    "sqlalchemy>=2.0.41,<3",
    "geoalchemy2>=0.17.1,<0.18",
    "shapely>=2.1.1,<3",
    "pycairo>=1.28.0,<2",
    "py-staticmaps>=0.4.0,<0.5",
    "coolname>=2.2.0,<3",
    "pyproj>=3.7.1,<4",
    "email-validator>=2.2.0,<3",
    "gunicorn>=23.0.0,<24",
    "dash-leaflet>=1.1.3,<2",
    "dash-form-factory==0.1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pytest-playwright>=0.6.2",
    "python-slugify>=8.0.0",
    "selenium>=4.0.0",
    "ruff>=0.7.4",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosmopolitan_app"]

