<!doctype html>
<html lang="en" style="min-height: 100%">
<head>
  {% block meta %}
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  {% endblock %}

  {% block styles %}
	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="{{ url_for("static", filename="flatly_bootstrap.css") }}">
	<!-- Cosmopolitan CSS -->
	<link rel="stylesheet" href="{{ url_for("static", filename="main.css") }}">
	<link rel="icon" type="image/x-icon" href="{{ url_for("static", filename="favicon.ico")}}" />
	<!--
	<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
	--!>
	<!--
	<script type="text/javascript"
					id="MathJax-script"
					async
					src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
	 --!>
  {% endblock %}

	{%- if reload_delay %}
	<script>
		function sleep(ms) {
				return new Promise(resolve => setTimeout(resolve, ms));
		}
		async function reload() {
				await sleep({{ reload_delay }} * 1000);
				window.location.href = window.location.href;
		}
		reload();
	</script>
	{%- endif %}
	<title>SOM Web</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
	<div class="container-fluid">
		<!-- Topbar -->
		<div class="row">
{% include "html/skeleton/topbar.html" %}
		</div>
		<!-- End Topbar -->

		<!-- Content -->
		<div class="row justify-content-center pt-2">
			<div class="col-md-11 col-lg-10 col-xl-9 bg-white border border-dark rounded p-0">
{% block content %}
{% endblock %}
			</div>
		</div>
		<!-- End Content -->

		<!-- Footer -->
		<div class="row justify-content-center mt-5">
			<div class="col-sm-11 col-md-11">
{% include "html/skeleton/footer.html" %}
			</div>
		</div>
		<!-- End Footer -->
	</div>

{% block scripts %}
	<script src="{{ url_for("static", filename="bootstrap-5.0.0.2.min.js") }}"></script>
{% endblock %}
</body>
</html>
