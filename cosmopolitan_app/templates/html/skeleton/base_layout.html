<!doctype html>
<html lang="en" style="min-height: 100%">
<head>
  {% block meta %}
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  {% endblock %}

  {% block styles %}
	<!-- Bootstrap CSS -->
	<link rel="stylesheet"
				href="https://cdn.jsdelivr.net/npm/bootswatch@5.2.3/dist/flatly/bootstrap.min.css"
				integrity="sha256-+omx7xYvI+/C0kfnQmjAIW8dDbTweWpbYHWzveX4ii4="
				crossorigin="anonymous">
	<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico')}}" />
	<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
	<script type="text/javascript"
					id="MathJax-script"
					async
					src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {% endblock %}

	{%- if reload_delay %}
	<script>
		function sleep(ms) {
				return new Promise(resolve => setTimeout(resolve, ms));
		}
		async function reload() {
				await sleep({{ reload_delay }} * 1000);
				window.location.href = window.location.href;
		}
		reload();
	</script>
	{%- endif %}
	<title>SOM Web</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
	<div class="container-fluid">
		<!-- Topbar -->
		<div class="row bg-dark mb-2">
{% include "html/skeleton/topbar.html" %}
		</div>
		<!-- End Topbar -->

		<!-- Content -->
		<div class="row justify-content-center p-1">
			<div class="col-md-11 col-lg-10 col-xl-9 bg-white border border-dark rounded px-5 py-2">
{% block content %}
{% endblock %}
			</div>
		</div>
		<!-- End Content -->

		<!-- Footer -->
		<div class="row justify-content-center mt-5">
			<div class="col-sm-11 col-md-11">
{% include "html/skeleton/footer.html" %}
			</div>
		</div>
		<!-- End Footer -->
	</div>

{% block scripts %}
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js" integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous"></script>
{% endblock %}
</body>
</html>
