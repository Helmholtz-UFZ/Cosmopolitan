version: "3.8"

services:

  cosmopolitan:
    image: cosmopolitan
    container_name: cosmopolitan
    build:
      context: .
      dockerfile: ./docker/dev.Dockerfile
      args:
        - SM_BRANCH=${SM_BRANCH}
    env_file: .env
    volumes:
      - "./cosmopolitan_app:/python_docker/cosmopolitan/cosmopolitan_app"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - "${FLASK_PORT}:${FLASK_PORT}"

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    logging:
      driver: 'none'  # disable saving logs
    ports:
      - "${EMAIL_PORT}:${EMAIL_PORT}" # stmp server
      - "${MAIL_HOG_PORT:-8025}:${MAIL_HOG_PORT:-8025}" # web ui

  postgres:
    image: postgres:latest
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PW}
      POSTGRES_DB: ${DB_NAME}
    container_name: postgres
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

