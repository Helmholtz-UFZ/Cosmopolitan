# Host-published ports read ${<SERVICE>_HOST_PORT:-<default>}: host side variable,
# container side fixed. cosmopolitan keeps the defaults; the other two stacks shift
# theirs so all three can run at once — see
# ../cosmo-suite/docs/plan/local-port-allocation.md.
# FLASK_PORT keeps its double role (container port and Dash test-server port), so
# the webserver falls back to it rather than to a literal.
services:
  webserver:
    image: cosmopolitan-webserver
    container_name: cosmopolitan-webserver
    build:
      context: .
      dockerfile: ./docker/dev.Dockerfile
    env_file: .env
    environment:
      TZ: Europe/Berlin
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - "${FLASK_HOST_PORT:-${FLASK_PORT}}:${FLASK_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - "./:/python_docker/cosmopolitan"
      - "/python_docker/cosmopolitan/.venv"

  worker:
    image: cosmopolitan-worker
    container_name: cosmopolitan-worker
    build:
      context: .
      dockerfile: ./docker/worker.Dockerfile
    env_file: .env
    environment:
      TZ: Europe/Berlin
    user: "${DOCKER_UID}:${DOCKER_GID}"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: redis_cosmopolitan
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgis/postgis:latest
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    container_name: postgres_cosmopolitan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  tileserver:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: cosmopolitan-tileserver
    platform: linux/amd64
    ports:
      - "${TILESERVER_HOST_PORT:-8001}:80"
    volumes:
      - "./cosmopolitan_app/work_dir:/data:ro"
    environment:
      CPL_TMPDIR: /tmp
      GDAL_CACHEMAX: 75%
      GDAL_INGESTED_BYTES_AT_OPEN: 32768
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: YES
      GDAL_HTTP_MULTIPLEX: YES
      GDAL_HTTP_VERSION: 2
      VSI_CACHE: TRUE
      VSI_CACHE_SIZE: 5000000

  # S3 server for local runs, copied from cosmo-suite's
  # docs/conventions/object_storage.md (CI takes the same image from the
  # framework's ci/object-storage.gitlab-ci.yml).
  object-storage:
    image: rustfs/rustfs:1.0.0
    container_name: object_storage_cosmopolitan
    ports:
      - "${OBJECT_STORAGE_HOST_PORT:-9000}:9000"
      - "${OBJECT_STORAGE_CONSOLE_HOST_PORT:-9001}:9001" # Web console at /rustfs/console/
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  redis_data:
