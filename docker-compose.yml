services:
  webserver:
    image: cosmopolitan-webserver
    container_name: cosmopolitan-webserver
    build:
      context: .
      dockerfile: ./docker/dev.Dockerfile
    env_file: .env
    environment:
      TZ: Europe/Berlin
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - "${FLASK_PORT}:${FLASK_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - "./:/python_docker/cosmopolitan"
      - "/python_docker/cosmopolitan/.venv"

  worker:
    image: cosmopolitan-worker
    container_name: cosmopolitan-worker
    build:
      context: .
      dockerfile: ./docker/worker.Dockerfile
    env_file: .env
    environment:
      TZ: Europe/Berlin
    user: "${DOCKER_UID}:${DOCKER_GID}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: redis_cosmopolitan
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgis/postgis:latest
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    container_name: postgres_cosmopolitan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  tileserver:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: cosmopolitan-tileserver
    platform: linux/amd64
    ports:
      - "8001:80"
    volumes:
      - "./cosmopolitan_app/work_dir:/data:ro"
    environment:
      CPL_TMPDIR: /tmp
      GDAL_CACHEMAX: 75%
      GDAL_INGESTED_BYTES_AT_OPEN: 32768
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: YES
      GDAL_HTTP_MULTIPLEX: YES
      GDAL_HTTP_VERSION: 2
      VSI_CACHE: TRUE
      VSI_CACHE_SIZE: 5000000

  minio:
    image: minio/minio:latest
    container_name: minio_cosmopolitan
    ports:
      - "9000:9000"
      - "9001:9001" # Web-based admin console
    environment:
      MINIO_ROOT_USER: accesskey
      MINIO_ROOT_PASSWORD: secretkey
    command: server /data --console-address ":9001"

volumes:
  redis_data:
