services:
  cosmopolitan:
    image: cosmopolitan
    container_name: cosmopolitan
    build:
      context: .
      dockerfile: ./docker/dev.Dockerfile
    env_file: .env
    volumes:
      - "./:/python_docker/cosmopolitan"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - "${FLASK_PORT}:${FLASK_PORT}"

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    logging:
      driver: "none" # disable saving logs
    ports:
      - "${EMAIL_PORT}:${EMAIL_PORT}" # stmp server
      - "${MAIL_HOG_PORT:-8025}:${MAIL_HOG_PORT:-8025}" # web ui

  postgres:
    image: postgres:latest
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PW}
      POSTGRES_DB: ${POSTGRES_NAME}
    container_name: postgres
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001" # Web-based admin console
    volumes:
      - minio_data:/data
      - ./minio_config:/root/.minio # For persistent configuration
    environment:
      MINIO_ROOT_USER: "root"
      MINIO_ROOT_PASSWORD: "rootpassword"
    command: server /data --console-address ":9001"

volumes:
  minio_data:
