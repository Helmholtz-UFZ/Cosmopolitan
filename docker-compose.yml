version: "3.8"

services:

  cosmopolitan:
    image: cosmopolitan
    container_name: cosmopolitan
    build:
      context: .
      dockerfile: ./docker/dev.Dockerfile
      args:
        - SM_BRANCH=${SM_BRANCH}
    env_file: .env
    volumes:
      - "./cosmopolitan_app:/python_docker/cosmopolitan/cosmopolitan_app"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - "${FLASK_PORT}:${FLASK_PORT}"

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    logging:
      driver: 'none'  # disable saving logs
    ports:
      - "${EMAIL_PORT}:${EMAIL_PORT}" # stmp server
      - "${MAIL_HOG_PORT:-8025}:${MAIL_HOG_PORT:-8025}" # web ui

  postgres:
    build:
      context: .
      dockerfile: ./docker/db.Dockerfile
      args:
        - POSTGRES_PASSWORD=${DB_PW}
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_DB=${DB_NAME}
    env_file: .env
    image: postgres
    container_name: postgres
    ports:
      - "${DB_PORT}:${DB_PORT}" # web ui
    # TODO set up a default DB
    # volumes:
    #   - ~/apps/postgres:/var/lib/postgresql/data
    # user: "${DOCKER_UID}:${DOCKER_GID}"

